name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: erp

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nakhla
          POSTGRES_PASSWORD: nakhla
          POSTGRES_DB: nakhla_erp
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nakhla -d nakhla_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://nakhla:nakhla@localhost:5432/nakhla_erp?schema=public
      # A throwaway key: the integration tests encrypt and decrypt, they do not keep anything.
      ENCRYPTION_KEY: dGVzdC1vbmx5LWtleS0zMi1ieXRlcy1sb25nLTEyMzQ1Ng==

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: erp/package-lock.json

      - run: npm ci

      - name: Generate the Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Apply migrations
        run: npm run db:deploy

      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload the coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: erp/coverage/
          retention-days: 14

      - name: Build
        run: npm run build

      - name: Check the OpenAPI document is up to date
        run: |
          npm run openapi:generate
          git diff --exit-code docs/openapi.json \
            || { echo "docs/openapi.json is stale — run 'npm run openapi:generate' and commit it."; exit 1; }

      - name: Verify the seed produces balanced books
        run: npm run db:seed

      - name: Verify stock balances agree with their movements
        run: npm run stock:rebuild

      - name: Verify a backup restores and still balances
        run: npx tsx scripts/backup.ts --verify

  e2e:
    name: end to end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: erp

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nakhla
          POSTGRES_PASSWORD: nakhla
          POSTGRES_DB: nakhla_erp
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nakhla -d nakhla_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://nakhla:nakhla@localhost:5432/nakhla_erp?schema=public
      ENCRYPTION_KEY: dGVzdC1vbmx5LWtleS0zMi1ieXRlcy1sb25nLTEyMzQ1Ng==

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: erp/package-lock.json

      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: erp/playwright-report/
          retention-days: 14
