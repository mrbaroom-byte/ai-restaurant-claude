# Single-host production deployment.
#
# Put a TLS terminator (Caddy, nginx, or your cloud load balancer) in front of `app`; nothing
# here listens on a public interface by itself.
#
#   cp .env.example .env && edit it
#   docker compose -f docker-compose.prod.yml run --rm migrate
#   docker compose -f docker-compose.prod.yml up -d
#
# For data residency, run this on a host inside Saudi Arabia and point BACKUP_S3_BUCKET at a
# bucket in the same region. See README.md.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nakhla_erp}
    volumes: ['db-data:/var/lib/postgresql/data']
    # Not published: only the application network reaches the database.
    expose: ['5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD:?set REDIS_PASSWORD}']
    volumes: ['redis-data:/data']
    expose: ['6379']

  migrate:
    image: ${IMAGE:-nakhla-erp:latest}
    build: .
    command: ['npx', 'prisma', 'migrate', 'deploy']
    depends_on:
      db: { condition: service_healthy }
    env_file: [.env]
    restart: 'no'

  app:
    image: ${IMAGE:-nakhla-erp:latest}
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    env_file: [.env]
    environment:
      NODE_ENV: production
    ports: ['127.0.0.1:3000:3000']

  worker:
    image: ${IMAGE:-nakhla-erp:latest}
    build: .
    restart: unless-stopped
    command: ['npx', 'tsx', 'src/server/jobs/worker.ts']
    depends_on:
      db: { condition: service_healthy }
    env_file: [.env]
    environment:
      NODE_ENV: production

  # Nightly encrypted backup with a restore check. A backup nobody has restored is a hope.
  backup:
    image: ${IMAGE:-nakhla-erp:latest}
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    env_file: [.env]
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        while true; do
          # 02:00 Riyadh time, after the day's trading has settled.
          sleep $$(( ( $$(date -d 'tomorrow 02:00' +%s) - $$(date +%s) ) ))
          npx tsx scripts/backup.ts --verify --retain 30 || echo "backup failed"
        done

volumes:
  db-data:
  redis-data:
